<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat2Go</title>
<style>
  :root {
    --blue: #2f5bff;
    --blue-dark: #1f3fcc;
    --ink: #14171f;
    --muted: #6b7280;
    --paper: #f4f6fb;
    --white: #ffffff;
    --line: #dfe3ee;
    --warn: #d9363e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; border: 0; }
  input, select { font: inherit; }

  /* Écran de connexion */
  #auth { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 28px; max-width: 420px; margin: 0 auto; }
  .logo { width: 84px; height: 84px; background: var(--blue); color: #fff; border-radius: 26px 26px 26px 6px; display: grid; place-items: center; font-size: 44px; font-weight: 800; margin-bottom: 18px; }
  #auth h1 { font-size: 34px; letter-spacing: -0.5px; }
  #auth p.sub { color: var(--muted); margin: 6px 0 24px; }
  .field { width: 100%; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--white); margin-bottom: 10px; }
  .field:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .btn { width: 100%; padding: 14px; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 700; }
  .btn:active { background: var(--blue-dark); }
  .link { background: none; color: var(--blue); font-weight: 600; padding: 14px; width: 100%; }
  #authError, #appError { color: var(--warn); font-size: 14px; min-height: 20px; margin-bottom: 8px; }

  /* Application */
  #app { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--white); border-bottom: 1px solid var(--line); }
  header .mini { width: 34px; height: 34px; border-radius: 11px 11px 11px 3px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 800; }
  header h2 { font-size: 18px; flex: 1; }
  header .small { background: none; color: var(--muted); font-size: 14px; padding: 6px; }

  #contacts { flex: 1; overflow-y: auto; padding: 12px; }
  .contact { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--white); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; line-height: 1.5; }

  #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 78%; padding: 10px 13px; border-radius: 18px; line-height: 1.35; word-wrap: break-word; }
  .msg.mine { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
  .msg.theirs { align-self: flex-start; background: var(--white); border-bottom-left-radius: 5px; }
  .msg img { display: block; max-width: 100%; border-radius: 12px; margin-bottom: 6px; }
  .msg .hint { display: block; font-size: 11px; opacity: .65; margin-top: 4px; }

  #composer { background: var(--white); border-top: 1px solid var(--line); padding: 10px; }
  #preview { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; }
  #preview select { flex: 1; padding: 8px; border-radius: 10px; border: 1.5px solid var(--line); }
  #preview .cancel { background: none; color: var(--warn); font-size: 22px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .field { margin: 0; flex: 1; }
  .icon { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); font-size: 20px; flex: none; }
  .send { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 18px; flex: none; }
</style>
</head>
<body>

<!-- Connexion / inscription -->
<section id="auth">
  <div class="logo">2</div>
  <h1>Chat2Go</h1>
  <p class="sub">Des messages et des photos qui disparaissent après lecture.</p>
  <input id="pseudo" class="field hidden" placeholder="Ton pseudo" autocomplete="nickname">
  <input id="email" class="field" type="email" placeholder="Adresse e-mail" autocomplete="email">
  <input id="password" class="field" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
  <div id="authError"></div>
  <button id="authSubmit" class="btn">Se connecter</button>
  <button id="authToggle" class="link">Pas de compte ? Créer un compte</button>
</section>

<!-- Application -->
<section id="app" class="hidden">
  <header>
    <button id="back" class="small hidden">‹ Retour</button>
    <div class="mini">2</div>
    <h2 id="title">Chat2Go</h2>
    <button id="logout" class="small">Déconnexion</button>
  </header>

  <div id="contacts"></div>

  <div id="chat" class="hidden">
    <div id="messages"></div>
    <div id="composer">
      <div id="appError"></div>
      <div id="preview" class="hidden">
        <img id="previewImg" alt="Aperçu de la photo">
        <select id="filter">
          <option value="none">Sans filtre</option>
          <option value="grayscale(1) contrast(1.1)">Noir et blanc</option>
          <option value="sepia(0.9)">Sépia</option>
          <option value="saturate(1.8) contrast(1.1)">Vif</option>
          <option value="hue-rotate(160deg) saturate(1.4)">Océan</option>
          <option value="blur(1.5px) brightness(1.1)">Rêve</option>
        </select>
        <button id="cancelPhoto" class="cancel" aria-label="Retirer la photo">✕</button>
      </div>
      <div class="row">
        <button id="photoBtn" class="icon" aria-label="Ajouter une photo">📷</button>
        <input id="photoInput" type="file" accept="image/*" class="hidden">
        <input id="text" class="field" placeholder="Écris un message" autocomplete="off">
        <button id="send" class="send" aria-label="Envoyer">➤</button>
      </div>
    </div>
  </div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, collection, onSnapshot, addDoc, deleteDoc,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0csK-ivtqwNi5WLV9nQ42oMrLJry92dg",
    authDomain: "chat2go-2b.firebaseapp.com",
    projectId: "chat2go-2b",
    storageBucket: "chat2go-2b.firebasestorage.app",
    messagingSenderId: "103840196617",
    appId: "1:103840196617:web:f0f9081299190e1a27f0d8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const MESSAGE_DELAY = 6000;  // un texte disparaît 6 s après avoir été vu
  const PHOTO_DELAY = 10000;   // une photo disparaît 10 s après avoir été vue

  let me = null;
  let isSignup = false;
  let unsubUsers = null;
  let unsubChat = null;
  let current = null;
  let photoData = null;
  const timers = new Set();

  /* ---------- Connexion / inscription ---------- */
  $("authToggle").onclick = () => {
    isSignup = !isSignup;
    $("pseudo").classList.toggle("hidden", !isSignup);
    $("authSubmit").textContent = isSignup ? "Créer mon compte" : "Se connecter";
    $("authToggle").textContent = isSignup ? "Déjà un compte ? Se connecter" : "Pas de compte ? Créer un compte";
    $("authError").textContent = "";
  };

  $("authSubmit").onclick = async () => {
    const email = $("email").value.trim();
    const password = $("password").value;
    const pseudo = $("pseudo").value.trim();
    $("authError").textContent = "";
    try {
      if (isSignup) {
        if (!pseudo) { $("authError").textContent = "Choisis un pseudo."; return; }
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", cred.user.uid), { pseudo, createdAt: serverTimestamp() });
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (e) {
      $("authError").textContent = friendlyError(e.code);
    }
  };

  function friendlyError(code) {
    const map = {
      "auth/invalid-email": "Cette adresse e-mail n’est pas valide.",
      "auth/missing-password": "Entre ton mot de passe.",
      "auth/weak-password": "Le mot de passe doit faire au moins 6 caractères.",
      "auth/email-already-in-use": "Cette adresse e-mail a déjà un compte.",
      "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
      "auth/operation-not-allowed": "Active la connexion e-mail/mot de passe dans Firebase (Authentication).",
      "permission-denied": "Accès refusé : vérifie les règles Firestore."
    };
    return map[code] || ("Erreur : " + code);
  }

  $("logout").onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    me = user;
    if (user) {
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      showContacts();
      listenUsers();
    } else {
      if (unsubUsers) unsubUsers();
      if (unsubChat) unsubChat();
      $("app").classList.add("hidden");
      $("auth").classList.remove("hidden");
    }
  });

  /* ---------- Liste des contacts ---------- */
  function listenUsers() {
    if (unsubUsers) unsubUsers();
    unsubUsers = onSnapshot(collection(db, "users"), (snap) => {
      const box = $("contacts");
      box.innerHTML = "";
      let count = 0;
      snap.forEach((d) => {
        if (d.id === me.uid) return;
        count++;
        const u = d.data();
        const b = document.createElement("button");
        b.className = "contact";
        const av = document.createElement("div");
        av.className = "avatar";
        av.textContent = (u.pseudo || "?").charAt(0).toUpperCase();
        const name = document.createElement("span");
        name.textContent = u.pseudo || "Sans pseudo";
        b.append(av, name);
        b.onclick = () => openChat(d.id, u.pseudo);
        box.appendChild(b);
      });
      if (!count) {
        box.innerHTML = '<div class="empty">Personne d’autre n’est inscrit pour l’instant.<br>Invite un ami à créer son compte pour discuter.</div>';
      }
    }, (e) => { $("contacts").textContent = friendlyError(e.code); });
  }

  function showContacts() {
    if (unsubChat) { unsubChat(); unsubChat = null; }
    current = null;
    clearTimers();
    $("chat").classList.add("hidden");
    $("contacts").classList.remove("hidden");
    $("back").classList.add("hidden");
    $("title").textContent = "Chat2Go";
  }
  $("back").onclick = showContacts;

  /* ---------- Conversation ---------- */
  function openChat(otherId, pseudo) {
    current = { id: otherId, chatId: [me.uid, otherId].sort().join("_") };
    $("contacts").classList.add("hidden");
    $("chat").classList.remove("hidden");
    $("back").classList.remove("hidden");
    $("title").textContent = pseudo || "Conversation";
    $("appError").textContent = "";

    if (unsubChat) unsubChat();
    const q = query(collection(db, "chats", current.chatId, "messages"), orderBy("createdAt"));
    unsubChat = onSnapshot(q, renderMessages, (e) => { $("appError").textContent = friendlyError(e.code); });
  }

  function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

  const scheduled = new Set();
  function renderMessages(snap) {
    const box = $("messages");
    box.innerHTML = "";
    if (snap.empty) {
      box.innerHTML = '<div class="empty">Aucun message. Écris le premier !</div>';
    }
    snap.forEach((d) => {
      const m = d.data();
      const mine = m.from === me.uid;
      const el = document.createElement("div");
      el.className = "msg " + (mine ? "mine" : "theirs");
      if (m.photo) {
        const img = document.createElement("img");
        img.src = m.photo;
        if (m.filter && m.filter !== "none") img.style.filter = m.filter;
        el.appendChild(img);
      }
      if (m.text) {
        const t = document.createElement("span");
        t.textContent = m.text;
        el.appendChild(t);
      }
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = mine ? "Disparaît après lecture" : "Disparaît dans quelques secondes";
      el.appendChild(hint);
      box.appendChild(el);

      // Le destinataire a vu le message : on le supprime après un court délai.
      if (!mine && document.visibilityState === "visible" && !scheduled.has(d.id)) {
        scheduled.add(d.id);
        const t = setTimeout(() => {
          deleteDoc(d.ref).catch(() => {});
          scheduled.delete(d.id);
        }, m.photo ? PHOTO_DELAY : MESSAGE_DELAY);
        timers.add(t);
      }
    });
    box.scrollTop = box.scrollHeight;
  }

  /* ---------- Envoi ---------- */
  async function send() {
    const text = $("text").value.trim();
    if (!text && !photoData) return;
    $("appError").textContent = "";
    try {
      await addDoc(collection(db, "chats", current.chatId, "messages"), {
        from: me.uid,
        to: current.id,
        text,
        photo: photoData || null,
        filter: photoData ? $("filter").value : "none",
        createdAt: serverTimestamp()
      });
      $("text").value = "";
      clearPhoto();
    } catch (e) {
      $("appError").textContent = friendlyError(e.code);
    }
  }
  $("send").onclick = send;
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

  /* ---------- Photos ---------- */
  $("photoBtn").onclick = () => $("photoInput").click();
  $("cancelPhoto").onclick = clearPhoto;
  $("filter").onchange = () => {
    const f = $("filter").value;
    $("previewImg").style.filter = f === "none" ? "" : f;
  };

  function clearPhoto() {
    photoData = null;
    $("photoInput").value = "";
    $("preview").classList.add("hidden");
    $("previewImg").style.filter = "";
    $("filter").value = "none";
  }

  // La photo est réduite puis stockée dans Firestore : pas besoin de Storage (gratuit).
  $("photoInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const max = 720;
      const ratio = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * ratio);
      c.height = Math.round(img.height * ratio);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      photoData = c.toDataURL("image/jpeg", 0.6);
      $("previewImg").src = photoData;
      $("preview").classList.remove("hidden");
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  };
</script>
</body>
</html>
